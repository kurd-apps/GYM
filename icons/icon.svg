<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="gymGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#gymGrad)" />
  <!-- Dumbbell Graphic -->
  <g fill="#ffffff" filter="url(#shadow)">
    <!-- Central Bar -->
    <rect x="140" y="232" width="232" height="48" rx="12" />
    <!-- Inner Collars -->
    <rect x="175" y="212" width="24" height="88" rx="8" />
    <rect x="313" y="212" width="24" height="88" rx="8" />
    <!-- Middle Plates -->
    <rect x="125" y="160" width="34" height="192" rx="12" />
    <rect x="353" y="160" width="34" height="192" rx="12" />
    <!-- Outer Large Plates -->
    <rect x="80" y="130" width="32" height="252" rx="12" />
    <rect x="400" y="130" width="32" height="252" rx="12" />
  </g>
</svg>